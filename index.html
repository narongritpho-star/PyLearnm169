        const PYTHON_LESSONS = [
          {
            id: 1,
            title: "1. การแสดงผลด้วย print()",
            level: "พื้นฐาน 1",
            description: "เรียนรู้การใช้คำสั่ง print() เพื่อแสดงข้อความออกทางหน้าจอ",
            task: "ให้นักเรียนเขียนคำสั่ง print() เพื่อแสดงข้อความว่า 'Hello Python'",
            initialCode: "# เขียนคำสั่งแสดงข้อความด้านล่างนี้\n",
            expectedOutput: "Hello Python",
            hint: "ใช้คำสั่ง print('Hello Python')"

            task: "สร้างตัวแปรชื่อ name เก็บชื่อของคุณ และสร้างตัวแปร age เก็บอายุ แล้วใช้ print() แสดงค่า name",
            initialCode: "# สร้างตัวแปร name และ age\nname = 'Somchai'\nage = 13\n\n# แสดงผลค่า name\n",
            expectedOutput: "Somchai",
            hint: "พิมพ์ print(name)"
          },
          {
            id: 3,
            title: "3. การคำนวณทางคณิตศาสตร์",
            level: "พื้นฐาน 3",
            description: "ตัวดำเนินการ บวก (+) ลบ (-) คูณ (*) หาร (/)",
            task: "กำหนดให้ a = 15 และ b = 5 ให้เขียนโค้ดหาผลคูณของ a และ b แล้วแสดงผลลัพธ์",
            initialCode: "a = 15\nb = 5\n# คำนวณผลคูณและแสดงผล\n",
            expectedOutput: "75",
            hint: "ใช้ print(a * b)"

          {

            description: "การใช้ตัวแปรตัวเลขและแปลงประเภทข้อมูลด้วย int()",
            task: "สร้างตัวแปร x = int('10') และ y = int('20') แล้วใช้ print() แสดงผลรวมของ x + y",

            task: "กำหนด score = 65 ให้เขียนเงื่อนไข if-else ถ้า score >= 50 ให้แสดง 'Pass' ถ้าไม่ใช่แสดง 'Fail'",
            initialCode: "score = 65\n# เขียนเงื่อนไข if-else ด้านล่าง\nif score >= 50:\n    print('Pass')\nelse:\n    print('Fail')",
            expectedOutput: "Pass",
            hint: "ตรวจสอบการเว้นวรรค (Indent) หลังคำสั่ง if และ else"
          },
          {
            id: 6,
            title: "6. การทำงานซ้ำด้วย for loop",
            level: "ท้าทาย",
            description: "การใช้คำสั่ง for ร่วมกับ range() ในการวนลูป",
            task: "เขียนคำสั่งวนลูปแสดงตัวเลข 0 ถึง 4 ออกมาทีละบรรทัดด้วย range(5)",
            initialCode: "# เขียนคำสั่ง for loop ด้วย range(5)\n",
            expectedOutput: "0\n1\n2\n3\n4",
            hint: "ใช้ for i in range(5): แล้วตามด้วย print(i)"
          }
        ];

        const INITIAL_STUDENTS = [
          { id: "10001", name: "เด็กชายกิตติศักดิ์ มีสุข", room: "ม.1/1", number: 1 },
          { id: "10002", name: "เด็กหญิงจินตนา รักดี", room: "ม.1/1", number: 2 },
          { id: "10003", name: "เด็กชายณัฐพงษ์ เรียนเก่ง", room: "ม.1/1", number: 3 },
          { id: "10004", name: "เด็กหญิงธนพร ขยันเพียร", room: "ม.1/2", number: 1 },
          { id: "10005", name: "เด็กชายปวินท์ สุขเสริฐ", room: "ม.1/2", number: 2 },
          { id: "10006", name: "เด็กหญิงศุภิสรา ปัญญาดี", room: "ม.1/3", number: 1 },
        ];

        function App() {
          const [currentRole, setCurrentRole] = React.useState('student-login'); 
          const [studentIdInput, setStudentIdInput] = React.useState('');
          const [currentStudent, setCurrentStudent] = React.useState(null);
          
          // Teacher PIN Auth State
          const [showPinModal, setShowPinModal] = React.useState(false);
          const [teacherPinInput, setTeacherPinInput] = React.useState('');

          // App Data
          const [students, setStudents] = React.useState(INITIAL_STUDENTS);
          const [selectedLesson, setSelectedLesson] = React.useState(PYTHON_LESSONS[0]);
          const [userCode, setUserCode] = React.useState(PYTHON_LESSONS[0].initialCode);
          const [codeOutput, setCodeOutput] = React.useState('');
          const [isRunning, setIsRunning] = React.useState(false);
          const [testResult, setTestResult] = React.useState(null); 
          const [submissions, setSubmissions] = React.useState([]);

          // 💾 ดึง URL จาก localStorage หรือใช้ค่าเริ่มต้นจาก DEFAULT_GAS_URL
          const [gasUrl, setGasUrl] = React.useState(() => {
            return localStorage.getItem('PYLEARN_GAS_URL') || DEFAULT_GAS_URL;
          });

          // บันทึก GAS URL ลง LocalStorage ทุกครั้งที่มีการเปลี่ยนแปลง
          React.useEffect(() => {
            if (gasUrl) {
              localStorage.setItem('PYLEARN_GAS_URL', gasUrl);
            }
          }, [gasUrl]);

          // Teacher Settings & Bulk Import
          const [selectedRoomFilter, setSelectedRoomFilter] = React.useState('ALL');
          const [searchStudentTerm, setSearchStudentTerm] = React.useState('');
          
          const [showStudentModal, setShowStudentModal] = React.useState(false);
          const [editingStudent, setEditingStudent] = React.useState(null);
          const [studentFormData, setStudentFormData] = React.useState({ id: '', name: '', room: 'ม.1/1', number: '' });
          
          const [showBulkModal, setShowBulkModal] = React.useState(false);
          const [bulkInputText, setBulkInputText] = React.useState('');

          const [showGasModal, setShowGasModal] = React.useState(false);
          const [toast, setToast] = React.useState(null);

          const showToast = (msg, type = 'info') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
          };

          const handleTeacherPinSubmit = (e) => {
            e.preventDefault();
            if (teacherPinInput === '2495') {
              setCurrentRole('teacher');
              setShowPinModal(false);
              setTeacherPinInput('');
              showToast("เข้าสู่แดชบอร์ดผู้สอนสำเร็จ", "success");
            } else {
              showToast("รหัสผ่านผู้สอน ไม่ถูกต้อง!", "error");
              setTeacherPinInput('');
            }
          };

          const handleBulkImport = () => {
            if (!bulkInputText.trim()) {
              showToast("กรุณากรอกข้อมูลนักเรียนที่ต้องการนำเข้า", "warning");
              return;
            }

            const lines = bulkInputText.split('\n');
            let addedCount = 0;
            let skippedCount = 0;
            const updatedStudents = [...students];

            lines.forEach(line => {
              const trimmed = line.trim();
              if (!trimmed) return;

              let parts = trimmed.split(/,|\t/);
              if (parts.length < 4) {
                parts = trimmed.split(/\s+/);
              }

              if (parts.length >= 5) {
                const id = parts[0].trim();
                const firstName = parts[1].trim();
                const lastName = parts[2].trim();
                const room = parts[3].trim();
                const num = parseInt(parts[4].trim(), 10) || 1;
                const fullName = `${firstName} ${lastName}`;

                if (id && !updatedStudents.some(s => s.id === id)) {
                  updatedStudents.push({ id, name: fullName, room, number: num });
                  addedCount++;
                } else {
                  skippedCount++;
                }
              } else if (parts.length === 4) {
                const id = parts[0].trim();
                const fullName = parts[1].trim();
                const room = parts[2].trim();
                const num = parseInt(parts[3].trim(), 10) || 1;

                if (id && !updatedStudents.some(s => s.id === id)) {
                  updatedStudents.push({ id, name: fullName, room, number: num });
                  addedCount++;
                } else {
                  skippedCount++;
                }
              }
            });

            setStudents(updatedStudents);
            setShowBulkModal(false);
            setBulkInputText('');
            showToast(`นำเข้าข้อมูลนักเรียนสำเร็จ ${addedCount} คน (ซ้ำ/ไม่ถูกต้อง ${skippedCount} คน)`, "success");
          };

          React.useEffect(() => {
            if (selectedLesson) {
              setUserCode(selectedLesson.initialCode);
              setCodeOutput('');
              setTestResult(null);
            }
          }, [selectedLesson]);

          const runPython = async () => {
            setIsRunning(true);
            setCodeOutput('');
            setTestResult(null);

            let outputAccumulator = '';

            const builtinRead = (x) => {
              if (window.Sk.builtinFiles === undefined || window.Sk.builtinFiles["files"][x] === undefined) {
                throw "File not found: '" + x + "'";
              }
              return window.Sk.builtinFiles["files"][x];
            };

            if (window.Sk) {
              window.Sk.configure({
                output: (text) => {
                  outputAccumulator += text;
                  setCodeOutput((prev) => prev + text);
                },
                read: builtinRead,
                execLimit: 5000 
              });

              try {
                await window.Sk.misceval.asyncToPromise(() => {
                  return window.Sk.importMainWithBody("<stdin>", false, userCode, true);
                });

                const cleanedOutput = outputAccumulator.trim();
                const expected = selectedLesson.expectedOutput.trim();

                if (cleanedOutput === expected) {
                  setTestResult({ success: true, message: "🎉 ถูกต้อง! ยินดีด้วยคุณผ่านโจทย์ข้อนี้แล้ว" });
                } else {
                  setTestResult({ 
                    success: false, 
                    message: `ผลลัพธ์ยังไม่ตรงกับโจทย์\n• ผลลัพธ์ของคุณ: "${cleanedOutput}"\n• ผลลัพธ์ที่ต้องการ: "${expected}"` 
                  });
                }
              } catch (err) {
                const errorMsg = err.toString();
                setCodeOutput((prev) => prev + "\n[Error] " + errorMsg);
                setTestResult({ success: false, message: "เกิดข้อผิดพลาดไวยากรณ์ (Syntax Error) ในโค้ด Python" });
              } finally {
                setIsRunning(false);
              }
            } else {
              setCodeOutput("กำลังโหลดระบบรันโค้ด Python กรุณารอครู่หนึ่ง...");
              setIsRunning(false);
            }
          };

          const handleSubmitCode = async () => {
            if (!currentStudent) return;
            if (!testResult || !testResult.success) {
              showToast("กรุณารันโค้ดและตรวจคำตอบให้ถูกต้องก่อนส่งงาน", "warning");
              return;
            }

            const newSubmission = {
              timestamp: new Date().toLocaleString('th-TH'),
              studentId: currentStudent.id,
              studentName: currentStudent.name,
              room: currentStudent.room,
              lessonId: selectedLesson.id,
              lessonTitle: selectedLesson.title,
              code: userCode,
              status: "ผ่าน"
            };

            setSubmissions((prev) => [newSubmission, ...prev]);
            showToast("บันทึกการส่งงานสำเร็จเรียบร้อย!", "success");

            // 🚀 เชื่อมต่อ Google Apps Script URL อัตโนมัติ
            const targetUrl = gasUrl.trim() || DEFAULT_GAS_URL;
            if (targetUrl && !targetUrl.includes('YOUR_SCRIPT_ID_HERE')) {
              try {
                await fetch(targetUrl, {
                  method: 'POST',
                  mode: 'no-cors',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(newSubmission)
                });
                showToast("ส่งข้อมูลไปยัง Google Sheet เรียบร้อยแล้วแบบ Realtime", "success");
              } catch (error) {
                console.error("Google Sheet Sync Error:", error);
                showToast("ส่งเข้า Sheet ไม่สำเร็จ ตรวจสอบ URL Web App", "error");
              }
            } else {
              showToast("ยังไม่ได้ระบุ Google Apps Script URL ให้ถูกต้อง", "warning");
            }
          };

          const handleStudentLogin = (e) => {
            e.preventDefault();
            const cleanId = studentIdInput.trim();
            if (cleanId.length !== 5) {
              showToast("กรุณากรอกรหัสประจำตัวนักเรียน 5 หลัก", "error");
              return;
            }

            const found = students.find((s) => s.id === cleanId);
            if (found) {
              setCurrentStudent(found);
              setCurrentRole('student');
              showToast(`ยินดีต้อนรับ ${found.name} (${found.room})`, "success");
            } else {
              showToast("ไม่พบรหัสนักเรียนนี้ในระบบ กรุณาติดต่อครูผู้สอน", "error");
            }
          };

          const handleSaveStudent = () => {
            if (!studentFormData.id || !studentFormData.name || !studentFormData.room) {
              showToast("กรุณากรอกข้อมูลให้ครบถ้วน", "warning");
              return;
            }

            if (editingStudent) {
              setStudents(students.map(s => s.id === editingStudent.id ? { ...studentFormData, number: Number(studentFormData.number) } : s));
              showToast("แก้ไขข้อมูลนักเรียนเรียบร้อย", "success");
            } else {
              if (students.some(s => s.id === studentFormData.id)) {
                showToast("รหัสนักเรียนนี้มีในระบบแล้ว", "error");
                return;
              }
              setStudents([...students, { ...studentFormData, number: Number(studentFormData.number) }]);
              showToast("เพิ่มนักเรียนใหม่เรียบร้อย", "success");
            }

            setShowStudentModal(false);
            setEditingStudent(null);
            setStudentFormData({ id: '', name: '', room: 'ม.1/1', number: '' });
          };

          const handleDeleteStudent = (id) => {
            if (confirm("คุณต้องการลบข้อมูลนักเรียนคนนี้ใช่หรือไม่?")) {
              setStudents(students.filter(s => s.id !== id));
              showToast("ลบข้อมูลนักเรียนเรียบร้อย", "info");
            }
          };

          const filteredStudents = React.useMemo(() => {
            return students.filter(s => {
              const matchRoom = selectedRoomFilter === 'ALL' || s.room === selectedRoomFilter;
              const matchSearch = s.name.includes(searchStudentTerm) || s.id.includes(searchStudentTerm);
              return matchRoom && matchSearch;
            });
          }, [students, selectedRoomFilter, searchStudentTerm]);

          const roomList = React.useMemo(() => {
            const rooms = Array.from(new Set(students.map(s => s.room)));
            return rooms.sort();
          }, [students]);

          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 font-sans flex flex-col">
              {/* Toast Notification */}
              {toast && (
                <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center gap-2 transition-all transform animate-bounce ${
                  toast.type === 'success' ? 'bg-emerald-600 border border-emerald-400' :
                  toast.type === 'error' ? 'bg-rose-600 border border-rose-400' :
                  toast.type === 'warning' ? 'bg-amber-600 border border-amber-400' : 'bg-blue-600 border border-blue-400'
                }`}>
                  <span>{toast.msg}</span>
                </div>
              )}

              {/* Navigation Header */}
              <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40 px-4 md:px-8 py-3.5 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="bg-gradient-to-tr from-indigo-500 to-cyan-400 p-2.5 rounded-xl text-slate-950 font-bold shadow-lg">
                    <IconCode2 />
                  </div>
                  <div>
                    <h1 className="font-bold text-lg md:text-xl leading-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-300 to-emerald-400">
                      PyLearn M.1 | วิทยาการคำนวณ
                    </h1>
                    <p className="text-xs text-slate-400">ระบบฝึกเขียนโปรแกรม Python สำหรับชั้นมัธยมศึกษาปีที่ 1</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  {currentRole === 'student' && currentStudent && (
                    <div className="flex items-center gap-3 bg-slate-800/90 px-3.5 py-1.5 rounded-xl border border-slate-700 text-sm">
                      <IconUserCheck />
                      <div>
                        <span className="font-medium text-emerald-300">{currentStudent.name}</span>
                        <span className="text-xs text-slate-400 ml-2">({currentStudent.room} เลขที่ {currentStudent.number})</span>
                      </div>
                      <button 
                        onClick={() => { setCurrentRole('student-login'); setCurrentStudent(null); }}
                        className="text-slate-400 hover:text-rose-400 ml-2 p-1 transition"
                        title="ออกจากระบบ"
                      >
                        <IconLogOut />
                      </button>
                    </div>
                  )}

                  {currentRole !== 'teacher' ? (
                    <button
                      onClick={() => setShowPinModal(true)}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3.5 py-2 rounded-xl border border-slate-700 flex items-center gap-1.5 transition font-medium shadow-sm"
                    >
                      <IconUsers />
                      แดชบอร์ดผู้สอน
                    </button>
                  ) : (
                    <button
                      onClick={() => setCurrentRole('student-login')}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-2 rounded-xl font-medium flex items-center gap-1.5 transition shadow-lg"
                    >
                      <IconBookOpen />
                      เข้าเรียนสำหรับนักเรียน
                    </button>
                  )}
                </div>
              </header>

              {/* Main Workspace Area */}
              <main className="flex-1 p-4 md:p-6 max-w-7xl w-full mx-auto">
                
                {/* STUDENT LOGIN SCREEN */}
                {currentRole === 'student-login' && (
                  <div className="max-w-md mx-auto my-12 bg-slate-800/60 border border-slate-700/60 p-8 rounded-2xl shadow-2xl backdrop-blur">
                    <div className="text-center mb-6">
                      <div className="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/20">
                        <IconCode2 />
                      </div>
                      <h2 className="text-xl font-bold text-white">เข้าสู่ระบบการเรียน Python</h2>
                      <p className="text-sm text-slate-400 mt-1">กรอกรหัสประจำตัวนักเรียน 5 หลักเพื่อเริ่มฝึกฝน</p>
                    </div>

                    <form onSubmit={handleStudentLogin} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">รหัสประจำตัวนักเรียน (5 หลัก)</label>
                        <input
                          type="text"
                          maxLength={5}
                          value={studentIdInput}
                          onChange={(e) => setStudentIdInput(e.target.value.replace(/\D/g, ''))}
                          placeholder="เช่น 10001"
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl tracking-widest font-mono text-emerald-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          required
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-gradient-to-r from-indigo-500 to-sky-500 hover:from-indigo-600 hover:to-sky-600 text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2"
                      >
                        <span>เข้าสู่บทเรียน</span>
                        <IconChevronRight />
                      </button>
                    </form>

                    <div className="mt-6 pt-6 border-t border-slate-700/50 text-center">
                      <p className="text-xs text-slate-400">ทดสอบรหัสนักเรียนตัวอย่าง: <span className="text-indigo-400 font-mono">10001, 10002, 10004</span></p>
                    </div>
                  </div>
                )}

                {/* STUDENT LEARNING ENVIRONMENT */}
                {currentRole === 'student' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    {/* Sidebar Lessons List */}
                    <div className="lg:col-span-4 space-y-3">
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4">
                        <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                          <IconBookOpen />
                          บทเรียน Python ม.1
                        </h2>

                        <div className="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
                          {PYTHON_LESSONS.map((lesson) => {
                            const isSelected = selectedLesson.id === lesson.id;
                            const isPassed = submissions.some(s => s.studentId === currentStudent?.id && s.lessonId === lesson.id && s.status === 'ผ่าน');

                            return (
                              <button
                                key={lesson.id}
                                onClick={() => setSelectedLesson(lesson)}
                                className={`w-full text-left p-3 rounded-xl border transition flex items-start justify-between gap-2 ${
                                  isSelected 
                                    ? 'bg-indigo-600/20 border-indigo-500/60 text-white shadow-md' 
                                    : 'bg-slate-900/40 border-slate-800 text-slate-300 hover:bg-slate-800/60'
                                }`}
                              >
                                <div>
                                  <div className="text-xs font-semibold text-indigo-400 mb-0.5">{lesson.level}</div>
                                  <div className="font-medium text-sm leading-snug">{lesson.title}</div>
                                </div>

                                {isPassed && <IconCheckCircle />}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {/* Main Code Workspace */}
                    <div className="lg:col-span-8 space-y-4">
                      
                      {/* Task Description Card */}
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5">
                        <div className="flex items-center justify-between mb-2">
                          <span className="bg-indigo-500/20 text-indigo-300 text-xs px-2.5 py-1 rounded-md font-semibold border border-indigo-500/30">
                            {selectedLesson.level}
                          </span>
                          <span className="text-xs text-slate-400">บทเรียนที่ {selectedLesson.id} จาก {PYTHON_LESSONS.length}</span>
                        </div>

                        <h3 className="text-lg font-bold text-white mb-1">{selectedLesson.title}</h3>
                        <p className="text-sm text-slate-300 mb-3">{selectedLesson.description}</p>
                        
                        <div className="bg-slate-900/80 border border-slate-700/80 rounded-xl p-3.5 text-sm">
                          <span className="font-semibold text-emerald-400 block mb-1">🎯 โจทย์ที่ต้องทำ:</span>
                          <p className="text-slate-200">{selectedLesson.task}</p>
                        </div>
                      </div>

                      {/* Code Editor & Execution Panel */}
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                            <IconCode2 />
                            พื้นที่เขียนโค้ด Python
                          </span>
                          <div className="flex items-center gap-2">
                            <button
                              onClick={runPython}
                              disabled={isRunning}
                              className="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white text-xs px-4 py-2 rounded-xl font-medium flex items-center gap-1.5 transition shadow-lg"
                            >
                              <IconPlay />
                              {isRunning ? "กำลังรันโค้ด..." : "รันโปรแกรม"}
                            </button>
                            <button
                              onClick={handleSubmitCode}
                              className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-medium flex items-center gap-1.5 transition shadow-lg"
                            >
                              <IconUpload />
                              ส่งคำตอบ
                            </button>
                          </div>
                        </div>

                        <textarea
                          value={userCode}
                          onChange={(e) => setUserCode(e.target.value)}
                          rows={8}
                          className="w-full bg-slate-950 text-emerald-400 font-mono text-sm p-4 rounded-xl border border-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-y"
                          placeholder="# พิมพ์โค้ด Python ที่นี่..."
                        />

                        {/* Output Console */}
                        <div className="space-y-2">
                          <span className="text-xs font-semibold text-slate-400">ผลลัพธ์ (Console Output):</span>
                          <pre className="bg-slate-950 border border-slate-800 text-slate-200 p-4 rounded-xl text-sm font-mono min-h-[80px] whitespace-pre-wrap overflow-x-auto">
                            {codeOutput || <span className="text-slate-600 italic">กด "รันโปรแกรม" เพื่อดูผลลัพธ์ที่นี่</span>}
                          </pre>
                        </div>

                        {/* Test Result Message */}
                        {testResult && (
                          <div className={`p-4 rounded-xl border text-sm flex items-start gap-3 ${
                            testResult.success 
                              ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' 
                              : 'bg-rose-950/60 border-rose-500/50 text-rose-200'
                          }`}>
                            {testResult.success ? <IconCheckCircle /> : <IconXCircle />}
                            <div className="whitespace-pre-line leading-relaxed">
                              {testResult.message}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* TEACHER DASHBOARD */}
                {currentRole === 'teacher' && (
                  <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/60 border border-slate-700/60 p-5 rounded-2xl">
                      <div>
                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                          <IconUsers />
                          ระบบจัดการและแดชบอร์ดผู้สอน
                        </h2>
                        <p className="text-xs text-slate-400 mt-0.5">ตรวจสอบการส่งงาน เพิ่ม/ลบ ข้อมูลนักเรียน และตั้งค่าระบบ</p>
                      </div>

                      <div className="flex items-center gap-2 flex-wrap">
                        <button
                          onClick={() => { setEditingStudent(null); setStudentFormData({ id: '', name: '', room: 'ม.1/1', number: '' }); setShowStudentModal(true); }}
                          className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-2 rounded-xl font-medium flex items-center gap-1.5 transition"
                        >
                          <IconPlus />
                          เพิ่มนักเรียน
                        </button>
                        <button
                          onClick={() => setShowBulkModal(true)}
                          className="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3.5 py-2 rounded-xl font-medium flex items-center gap-1.5 transition"
                        >
                          <IconUpload />
                          นำเข้าหลายคน (Bulk)
                        </button>
                        <button
                          onClick={() => setShowGasModal(true)}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-xl font-medium flex items-center gap-1.5 transition"
                        >
                          <IconSettings />
                          ตั้งค่า Google Sheet
                        </button>
                      </div>
                    </div>

                    {/* Filter and Search Bar */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="relative">
                        <span className="absolute left-3.5 top-3"><IconSearch /></span>
                        <input
                          type="text"
                          placeholder="ค้นหาชื่อ หรือ รหัสนักเรียน..."
                          value={searchStudentTerm}
                          onChange={(e) => setSearchStudentTerm(e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>

                      <div className="relative">
                        <span className="absolute left-3.5 top-3"><IconFilter /></span>
                        <select
                          value={selectedRoomFilter}
                          onChange={(e) => setSelectedRoomFilter(e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                          <option value="ALL">ทุกห้องเรียน</option>
                          {roomList.map(r => <option key={r} value={r}>{r}</option>)}
                        </select>
                      </div>

                      <div className="bg-slate-800/40 border border-slate-700/40 rounded-xl px-4 py-2 flex items-center justify-between text-xs text-slate-300">
                        <span>จำนวนนักเรียน: <strong className="text-indigo-400 font-semibold">{filteredStudents.length}</strong> คน</span>
                        <span>ส่งงานแล้ว: <strong className="text-emerald-400 font-semibold">{submissions.length}</strong> รายการ</span>
                      </div>
                    </div>

                    {/* Student List Table */}
                    <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
                      <div className="px-5 py-3.5 border-b border-slate-700/60 bg-slate-900/40">
                        <h3 className="font-bold text-sm text-slate-200">รายชื่อนักเรียนในระบบ</h3>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm text-slate-300">
                          <thead className="bg-slate-900/80 text-xs text-slate-400 uppercase border-b border-slate-700/60">
                            <tr>
                              <th className="px-5 py-3">รหัสประจำตัว</th>
                              <th className="px-5 py-3">ชื่อ-นามสกุล</th>
                              <th className="px-5 py-3">ห้องเรียน</th>
                              <th className="px-5 py-3">เลขที่</th>
                              <th className="px-5 py-3 text-right">จัดการ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {filteredStudents.length === 0 ? (
                              <tr>
                                <td colSpan="5" className="text-center py-6 text-slate-500">ไม่พบข้อมูลนักเรียน</td>
                              </tr>
                            ) : (
                              filteredStudents.map((s) => (
                                <tr key={s.id} className="hover:bg-slate-800/40 transition">
                                  <td className="px-5 py-3 font-mono text-indigo-400">{s.id}</td>
                                  <td className="px-5 py-3 font-medium text-slate-200">{s.name}</td>
                                  <td className="px-5 py-3">{s.room}</td>
                                  <td className="px-5 py-3">{s.number}</td>
                                  <td className="px-5 py-3 text-right space-x-2">
                                    <button
                                      onClick={() => { setEditingStudent(s); setStudentFormData(s); setShowStudentModal(true); }}
                                      className="text-slate-400 hover:text-indigo-400 p-1 transition"
                                    >
                                      <IconEdit />
                                    </button>
                                    <button
                                      onClick={() => handleDeleteStudent(s.id)}
                                      className="text-slate-400 hover:text-rose-400 p-1 transition"
                                    >
                                      <IconTrash />
                                    </button>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Submissions Table */}
                    <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
                      <div className="px-5 py-3.5 border-b border-slate-700/60 bg-slate-900/40">
                        <h3 className="font-bold text-sm text-slate-200">ประวัติการส่งงานล่าสุด</h3>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm text-slate-300">
                          <thead className="bg-slate-900/80 text-xs text-slate-400 uppercase border-b border-slate-700/60">
                            <tr>
                              <th className="px-5 py-3">เวลาส่ง</th>
                              <th className="px-5 py-3">นักเรียน</th>
                              <th className="px-5 py-3">ห้อง</th>
                              <th className="px-5 py-3">บทเรียน</th>
                              <th className="px-5 py-3">สถานะ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800">
                            {submissions.length === 0 ? (
                              <tr>
                                <td colSpan="5" className="text-center py-6 text-slate-500">ยังไม่มีประวัติการส่งงาน</td>
                              </tr>
                            ) : (
                              submissions.map((sub, index) => (
                                <tr key={index} className="hover:bg-slate-800/40 transition">
                                  <td className="px-5 py-3 text-xs text-slate-400">{sub.timestamp}</td>
                                  <td className="px-5 py-3 font-medium text-slate-200">{sub.studentName} ({sub.studentId})</td>
                                  <td className="px-5 py-3">{sub.room}</td>
                                  <td className="px-5 py-3 text-indigo-300">{sub.lessonTitle}</td>
                                  <td className="px-5 py-3">
                                    <span className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                      <IconCheckCircle /> ผ่าน
                                    </span>
                                  </td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* MODALS AREA */}
              
              {/* Teacher PIN Modal */}
              {showPinModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-sm w-full space-y-4">
                    <div className="text-center">
                      <div className="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center mx-auto mb-2 border border-amber-500/20">
                        <IconLock />
                      </div>
                      <h3 className="font-bold text-lg text-white">ยืนยันตัวตนผู้สอน</h3>
                      <p className="text-xs text-slate-400 mt-1">กรอก PIN ผู้สอนเพื่อเข้าสู่แดชบอร์ด</p>
                    </div>

                    <form onSubmit={handleTeacherPinSubmit} className="space-y-4">
                      <input
                        type="password"
                        maxLength={4}
                        value={teacherPinInput}
                        onChange={(e) => setTeacherPinInput(e.target.value.replace(/\D/g, ''))}
                        placeholder="PIN 4 หลัก (2495)"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl tracking-widest font-mono text-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        autoFocus
                        required
                      />

                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => setShowPinModal(false)}
                          className="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-xl text-sm font-medium transition"
                        >
                          ยกเลิก
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg"
                        >
                          เข้าสู่ระบบ
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Student Form Modal */}
              {showStudentModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-md w-full space-y-4">
                    <h3 className="font-bold text-lg text-white">
                      {editingStudent ? "แก้ไขข้อมูลนักเรียน" : "เพิ่มนักเรียนใหม่"}
                    </h3>

                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">รหัสประจำตัว (5 หลัก)</label>
                        <input
                          type="text"
                          disabled={!!editingStudent}
                          maxLength={5}
                          value={studentFormData.id}
                          onChange={(e) => setStudentFormData({ ...studentFormData, id: e.target.value.replace(/\D/g, '') })}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-mono text-emerald-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50"
                          placeholder="เช่น 10007"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">ชื่อ-นามสกุล</label>
                        <input
                          type="text"
                          value={studentFormData.name}
                          onChange={(e) => setStudentFormData({ ...studentFormData, name: e.target.value })}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                          placeholder="เช่น เด็กชายสมศักดิ์ รักดี"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">ห้องเรียน</label>
                          <input
                            type="text"
                            value={studentFormData.room}
                            onChange={(e) => setStudentFormData({ ...studentFormData, room: e.target.value })}
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="เช่น ม.1/1"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">เลขที่</label>
                          <input
                            type="number"
                            value={studentFormData.number}
                            onChange={(e) => setStudentFormData({ ...studentFormData, number: e.target.value })}
                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            placeholder="เช่น 1"
                          />
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 pt-2">
                      <button
                        onClick={() => setShowStudentModal(false)}
                        className="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-xl text-sm font-medium transition"
                      >
                        ยกเลิก
                      </button>
                      <button
                        onClick={handleSaveStudent}
                        className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg"
                      >
                        บันทึกข้อมูล
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Bulk Import Modal */}
              {showBulkModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-lg w-full space-y-4">
                    <div>
                      <h3 className="font-bold text-lg text-white">นำเข้าข้อมูลนักเรียนแบบกลุ่ม (Bulk Import)</h3>
                      <p className="text-xs text-slate-400 mt-1">วางข้อมูลจาก Excel หรือไฟล์ข้อความ (1 บรรทัดต่อ 1 คน)</p>
                    </div>

                    <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-xs text-slate-300 font-mono leading-relaxed">
                      รูปแบบข้อมูลที่รองรับ:<br/>
                      10001, เด็กชายสมชาย ใจดี, ม.1/1, 1<br/>
                      10002  เด็กหญิงสมหญิง  รักเรียน  ม.1/1  2
                    </div>

                    <textarea
                      value={bulkInputText}
                      onChange={(e) => setBulkInputText(e.target.value)}
                      rows={6}
                      className="w-full bg-slate-900 text-slate-200 font-mono text-sm p-3.5 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      placeholder="วางข้อมูลนักเรียนที่นี่..."
                    />

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setShowBulkModal(false)}
                        className="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-xl text-sm font-medium transition"
                      >
                        ยกเลิก
                      </button>
                      <button
                        onClick={handleBulkImport}
                        className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg"
                      >
                        เริ่มนำเข้าข้อมูล
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Google Apps Script Settings Modal */}
              {showGasModal && (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-lg w-full space-y-4">
                    <div>
                      <h3 className="font-bold text-lg text-white">ตั้งค่า Google Apps Script Web App</h3>
                      <p className="text-xs text-slate-400 mt-1">ตั้งค่า URL เพื่อบันทึกผลการส่งงานของนักเรียนเข้าสู่ Google Sheet อัตโนมัติ</p>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Web App URL</label>
                      <input
                        type="url"
                        value={gasUrl}
                        onChange={(e) => setGasUrl(e.target.value)}
                        placeholder="https://script.google.com/macros/s/.../exec"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm font-mono text-emerald-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 text-xs text-slate-400">
                      💡 <strong>คำแนะนำ:</strong> เมื่อกรอก URL และกดบันทึกแล้ว เบราว์เซอร์จะจำ URL นี้ไว้ตลอดไป แม้ว่าจะรันหรือรีเฟรชหน้าเว็บใหม่ก็ตาม
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setShowGasModal(false)}
                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg"
                      >
                        บันทึกการตั้งค่า
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
